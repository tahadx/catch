[package]
name = "catch"
version = "0.1.0"
authors = ["Taha Sadough <tahasdx@gmail.com>"]
edition = "2021"
description = "Native download manager backend for the Omarchy Catch plugin"
license = "MIT"

[[bin]]
name = "catch"
path = "src/main.rs"

[[bin]]
name = "catch-host"
path = "src/bin/catch-host.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process"] }
